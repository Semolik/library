version: '3.9'

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  starter-network:
    name: starter-network

services:
  postgres:
    extends:
      file: _docker-compose.base.yaml
      service: postgres
    networks:
      - starter-network

  redis:
    extends:
      file: _docker-compose.base.yaml
      service: redis
    networks:
      - starter-network

  minio:
    extends:
      file: _docker-compose.base.yaml
      service: minio
    networks:
      - starter-network

